---
deployment:
  tasks:
    - /bin/echo "=== Deploying fuma-frontend ==="

    # Install dependencies (first few times will take longer)
    - /bin/npm install

    # Build React app
    - /bin/npm run build

    # Ensure deploy folder exists
    - /bin/mkdir -p /home/fuma/public_html/fumamain

    # Sync built files to public_html (change 'build/' to 'dist/' if using Vite)
    - /bin/rsync -av --delete build/ /home/fuma/public_html/fumamain/

    - /bin/echo "=== fuma-frontend deploy complete ==="
